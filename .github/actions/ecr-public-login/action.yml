---
# Logs docker in to public.ecr.aws with the pull-only role of the MCloud AWS account through GitHub OIDC. The
# anonymous pulls are limited to 1 per second per IP, which the runners share with other users, so the docker jobs
# failed with 429 Too Many Requests; the authenticated ones are counted per account (10 per second).
# The job needs `id-token: write`:
#   permissions:
#     contents: read
#     id-token: write
#   steps:
#     - uses: zebrunner/mcloud-conventions/.github/actions/ecr-public-login@v1
# Without an OIDC token (a pull request from a fork or of Dependabot) or when the login fails, the job goes on with
# anonymous pulls. The AWS credentials are given to the login step only, the next steps of the job do not get them.
name: ecr-public-login
description: Log docker in to public.ecr.aws with the pull-only role (GitHub OIDC), anonymous pulls without it
inputs:
  role:
    description: the IAM role, its policy allows ecr-public:GetAuthorizationToken and sts:GetServiceBearerToken only
    default: arn:aws:iam::659932254483:role/github-actions-ecr-public-pull
outputs:
  authenticated:
    description: "`true` when docker is logged in to public.ecr.aws"
    value: ${{ steps.login.outcome == 'success' }}
runs:
  using: composite
  steps:
    - name: Check the OIDC token
      id: oidc
      shell: bash
      run: |
        if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice title=public.ecr.aws::no OIDC token (id-token: write, a pull request from a fork or of Dependabot), the pulls are anonymous"
        fi
    - name: AWS credentials of the pull-only role
      id: aws
      if: steps.oidc.outputs.available == 'true'
      continue-on-error: true
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role }}
        # the tokens of ECR Public are issued in us-east-1 only
        aws-region: us-east-1
        output-env-credentials: false
        output-credentials: true
        # 12 by default: a denied role took more than a minute
        retry-max-attempts: 3
    - name: Log in to public.ecr.aws
      id: login
      if: steps.aws.outcome == 'success'
      continue-on-error: true
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      with:
        registry-type: public
      env:
        AWS_REGION: us-east-1
        AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
    - name: Report the anonymous pulls
      if: steps.oidc.outputs.available == 'true' && steps.login.outcome != 'success'
      shell: bash
      run: echo "::warning title=public.ecr.aws::the login failed, the pulls are anonymous (1 per second per IP)"
